<header class="container" id="hero">
    <app-bubble></app-bubble>
    
    <div class="navigation">
        <app-logo></app-logo>
        <app-navbar></app-navbar>
        <app-navmenu></app-navmenu>
    </div>
    
    <div class="hero-container">
        <div>
            <picture>
                <!-- Tightly cropped photo on phones: its bottom edge is the cut of the torso -->
                <source media="(max-width: 800px), (max-height: 520px) and (orientation: landscape)" srcset="assets/img/robin-cropped.png">
                <img src="assets/img/robin.png" alt="Robin Angelé" draggable="false">
            </picture>
        </div>
        <div class="greeting">
            <p data-aos="fade-up" data-aos-duration="1000" data-aos-anchor-placement="bottom-bottom">{{ 'HERO.GREETING' | translate }} {{ name }}</p>
            <h1 [style.--role-scale]="roleScale('HERO.ROLE_1' | translate)" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="300" data-aos-anchor-placement="bottom-bottom">{{ 'HERO.ROLE_1' | translate }}</h1>
            <h2 [style.--role-scale]="roleScale('HERO.ROLE_2' | translate)" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="600" data-aos-anchor-placement="bottom-bottom">{{ 'HERO.ROLE_2' | translate }}</h2>
            <div class="cta-section">
                <p>{{ 'HERO.SCROLL' | translate }}</p>
                <div class="line"></div>
                <app-social-media-header></app-social-media-header>
            </div>
        </div>
    </div>
</header>
