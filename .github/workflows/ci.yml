name: Check pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Angular 22 needs Node ^22.22.3, ^24.15.0 or >=26
          node-version: 24

      # The same install and build as the deploy workflow, so a pull request that would
      # fail the deploy fails here first.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false
        env:
          NG_CLI_ANALYTICS: 'false'

      - name: Build
        run: npx ng build
        env:
          NG_CLI_ANALYTICS: 'false'
